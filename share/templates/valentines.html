<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --paper: #f6ecd9;
    --paper-2: #efe2c6;
    --rose: #a8324a;
    --rose-deep: #7a1f33;
    --gold: #b8893a;
    --gold-soft: #d4ad60;
    --rule: #c9b48a;
    --velvet: #2a1f1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--velvet);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184, 137, 58, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(168, 50, 74, 0.08) 0%, transparent 50%),
      repeating-linear-gradient(45deg, transparent 0, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 3px);
  }
  .card {
    position: absolute;
    top: 38px; left: 60px;
    width: 1080px; height: 554px;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 0% 0%, rgba(184, 137, 58, 0.08), transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(168, 50, 74, 0.06), transparent 60%);
    box-shadow:
      0 18px 40px rgba(0,0,0,0.4),
      inset 0 0 0 1px rgba(184, 137, 58, 0.25);
    padding: 56px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .vol {
    display: flex; justify-content: space-between; width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
    margin-bottom: 22px;
  }
  .heart {
    font-size: 56px;
    color: var(--rose);
    line-height: 1;
    margin-bottom: 14px;
  }
  .kicker {
    font-family: 'Pinyon Script', cursive;
    font-size: 56px;
    color: var(--rose);
    line-height: 1;
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 88px;
    line-height: 1.0;
    font-weight: 500;
    letter-spacing: -1.5px;
    color: var(--ink);
    max-width: 880px;
  }
  h1 .em {
    font-style: italic;
    color: var(--rose);
  }
  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 24px;
    color: var(--rule);
    margin-top: 18px;
    max-width: 800px;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid var(--rule);
    padding-top: 14px;
  }
  .brand {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="vol">
        <span>Vol. II · No. 86</span>
        <span>Saint Valentine's Edition</span>
        <span>Feb. 14, 2026</span>
      </div>
      <div class="top">
        <div class="heart">♥</div>
        <div class="kicker">Correspondence</div>
        <h1>A love letter to the <span class="em">$5 scratcher.</span></h1>
        <div class="subtitle">A Valentine's Day love letter to the most underrated ticket in the rack.</div>
      </div>
    </div>
    <div class="footer">
      <div class="brand">SmartScratcher</div>
      <div class="meta">— Yours, sincerely —</div>
    </div>
  </div>
</body>
</html>
