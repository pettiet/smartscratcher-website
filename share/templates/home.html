<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #2d2a24;
    --cream: #fff9e6;
    --cream-deep: #fff3cc;
    --yellow: #ffd60a;
    --yellow-deep: #e6b800;
    --red: #ff3b30;
    --muted: #6b6557;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    background-image:
      radial-gradient(ellipse at 92% -5%, rgba(255, 214, 10, 0.32), transparent 55%),
      radial-gradient(ellipse at -5% 105%, rgba(255, 59, 48, 0.08), transparent 55%);
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed; inset: 22px;
    border: 2px solid var(--ink);
    pointer-events: none;
  }
  .frame {
    position: relative;
    width: 100%; height: 100%;
    padding: 50px 80px 42px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .wordmark {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -0.6px;
    color: var(--ink);
    display: inline-flex; align-items: center; gap: 12px;
  }
  .wordmark .s-badge { display: block; }
  .wordmark .wm-hl {
    background: var(--yellow);
    padding: 0 4px 1px;
    display: inline-block;
    transform: rotate(-1.5deg);
  }
  .wordmark .wm-tail { padding-left: 2px; }
  .states {
    display: flex; gap: 6px;
  }
  .state {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.18em;
    color: var(--ink);
    background: var(--cream-deep);
    border: 1.5px solid var(--ink);
    padding: 7px 12px 6px;
  }
  .center {
    display: flex; flex-direction: column; justify-content: center;
    flex: 1;
    padding: 4px 0 6px;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 22px;
    display: inline-flex; align-items: center; gap: 14px;
    align-self: flex-start;
  }
  .kicker .star {
    color: var(--ink);
    font-size: 16px;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 116px;
    line-height: 0.94;
    font-weight: 800;
    letter-spacing: -2.5px;
    color: var(--ink);
  }
  h1 .strip {
    position: relative;
    background: var(--yellow);
    padding: 4px 22px 10px;
    box-shadow: 5px 5px 0 var(--ink);
    margin-left: -6px;
    display: inline-block;
    transform: rotate(-1.4deg);
    border: 2.5px solid var(--ink);
  }
  h1 .strip::after {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -58deg,
      rgba(0,0,0,0.07) 0px,
      rgba(0,0,0,0.07) 1.2px,
      transparent 1.2px,
      transparent 9px
    );
    pointer-events: none;
  }
  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 27px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-top: 32px;
    max-width: 940px;
    line-height: 1.3;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 2px solid var(--ink);
    padding-top: 16px;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="wordmark"><svg class="s-badge" width="44" height="44" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="hbl" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#111111" stroke-width="1.7"/></pattern></defs><circle cx="60" cy="60" r="44" fill="#ffd60a"/><text x="55" y="91" font-family="Bricolage Grotesque" font-size="74" font-weight="800" fill="url(#hbl)" text-anchor="middle">S</text><text x="61" y="85" font-family="Bricolage Grotesque" font-size="74" font-weight="800" fill="#111111" text-anchor="middle">S</text></svg><span class="wm-text"><span class="wm-hl">Smart</span><span class="wm-tail">Scratcher</span></span></div>
      <div class="states">
        <span class="state">NOW IN 15 STATES</span>
      </div>
    </div>
    <div class="center">
      <div class="kicker"><span class="star">★</span>The smart friend at the gas station<span class="star">★</span></div>
      <h1>Stop buying<br><span class="strip">dead scratchers.</span></h1>
      <div class="subtitle">Which scratch-offs still have real prizes? We do the math every time the lottery updates.</div>
    </div>
    <div class="footer">
      <div class="url">smartscratcherapp.com</div>
      <div class="tag">— Real data, real prizes —</div>
    </div>
  </div>
</body>
</html>
