<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #2d2a24;
    --cream: #fff9e6;
    --cream-deep: #fff3cc;
    --yellow: #ffd60a;
    --yellow-deep: #e6b800;
    --red: #ff3b30;
    --muted: #6b6557;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    background-image:
      radial-gradient(ellipse at 92% -5%, rgba(255, 214, 10, 0.32), transparent 55%),
      radial-gradient(ellipse at -5% 105%, rgba(255, 59, 48, 0.08), transparent 55%);
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed; inset: 22px;
    border: 2px solid var(--ink);
    pointer-events: none;
  }
  .frame {
    position: relative;
    width: 100%; height: 100%;
    padding: 50px 80px 42px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .wordmark {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -0.6px;
    color: var(--ink);
    display: inline-flex; align-items: center; gap: 12px;
  }
  .wordmark .dot {
    width: 14px; height: 14px;
    background: var(--yellow);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 2.5px var(--ink);
  }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.18em;
    color: white;
    background: var(--red);
    border: 1.5px solid var(--ink);
    padding: 7px 14px 6px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .center {
    display: flex; flex-direction: column; justify-content: center;
    flex: 1;
    padding: 4px 0 6px;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 20px;
    display: inline-flex; align-items: center; gap: 14px;
    align-self: flex-start;
  }
  .kicker .star { color: var(--ink); font-size: 16px; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 108px;
    line-height: 0.94;
    font-weight: 800;
    letter-spacing: -2.5px;
    color: var(--ink);
  }
  h1 .strip {
    position: relative;
    background: var(--yellow);
    padding: 4px 22px 10px;
    box-shadow: 5px 5px 0 var(--ink);
    margin-left: -6px;
    display: inline-block;
    transform: rotate(-1.4deg);
    border: 2.5px solid var(--ink);
  }
  .sub {
    margin-top: 22px;
    font-size: 24px;
    font-weight: 500;
    color: var(--ink-soft);
    max-width: 860px;
  }
  .sub strong { font-weight: 700; }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .states {
    display: flex; gap: 8px;
  }
  .state {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.14em;
    color: var(--ink);
    background: var(--yellow);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 9px 15px 8px;
  }
  .tally {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .tally b { color: var(--ink); font-size: 18px; }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div class="wordmark"><span class="dot"></span>SmartScratcher</div>
    <div class="badge">JUST ADDED</div>
  </div>
  <div class="center">
    <div class="kicker"><span class="star">✷</span> Our biggest expansion ever <span class="star">✷</span></div>
    <h1>Seven new states.<br><span class="strip">One very big day.</span></h1>
    <div class="sub">Michigan, Maryland, Washington, South Carolina, Virginia, Indiana &amp; Missouri — <strong>every scratcher, ranked daily.</strong></div>
  </div>
  <div class="bottom">
    <div class="states">
      <span class="state">MI</span><span class="state">MD</span><span class="state">WA</span><span class="state">SC</span><span class="state">VA</span><span class="state">IN</span><span class="state">MO</span>
    </div>
    <div class="tally">NOW IN <b>16</b> STATES</div>
  </div>
</div>
</body>
</html>
