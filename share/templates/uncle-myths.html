<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --bg2: #1a1825;
    --cream: #fffffe;
    --yellow: #ffe156;
    --pink: #ff6b9d;
    --mint: #4ade80;
    --purple: #a78bfa;
    --orange: #ff8c42;
    --muted: #a0a0b8;
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --serif: 'Instrument Serif', Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--sans);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,107,157,0.18), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(167,139,250,0.18), transparent 45%),
      radial-gradient(circle at 60% 30%, rgba(74,222,128,0.10), transparent 50%);
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .frame {
    position: relative;
    width: 100%; height: 100%;
    padding: 48px 90px 38px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .kicker {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--yellow);
    background: rgba(255,225,86,0.1);
    border: 1px solid var(--yellow);
    padding: 10px 18px;
    border-radius: 100px;
    align-self: flex-start;
  }
  h1 {
    font-family: var(--serif);
    font-size: 86px;
    line-height: 1.02;
    font-weight: 400;
    letter-spacing: -1.5px;
    margin-top: 22px;
  }
  h1 .num {
    color: var(--yellow);
    font-weight: 400;
  }
  h1 .swears {
    font-style: italic;
    color: var(--pink);
  }
  h1 .emoji {
    font-style: normal;
    font-size: 72px;
    vertical-align: -4px;
    margin: 0 6px;
  }
  .subtitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: 26px;
    color: var(--muted);
    margin-top: 22px;
    max-width: 940px;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(255,255,255,0.12);
    padding-top: 18px;
  }
  .brand {
    font-family: var(--serif);
    font-style: italic;
    font-size: 26px;
    color: var(--cream);
  }
  .brand .dot { color: var(--yellow); }
  .meta {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mint);
  }
</style>
</head>
<body>
  <div class="frame">
    <div>
      <div class="kicker">★ The definitive list ★</div>
      <h1><span class="num">7</span> scratcher myths<br>your <span class="emoji">👨</span> uncle <span class="swears">swears</span> by.</h1>
      <div class="subtitle">Every family has the guy who's cracked the code. Here's what the math actually says.</div>
    </div>
    <div class="footer">
      <div class="brand">SmartScratcher<span class="dot">.</span></div>
      <div class="meta">— With the actual math —</div>
    </div>
  </div>
</body>
</html>
