<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0d0a1f;
    --night2: #1a1438;
    --gold: #d4af37;
    --gold-bright: #ffd966;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --cream: #f5f0e8;
    --muted: #9ca0c0;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --display: 'Cinzel', serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--night);
    color: var(--cream);
    font-family: var(--serif);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.28), transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.22), transparent 50%),
      radial-gradient(2.5px 2.5px at 12% 30%, rgba(255,255,255,0.95), transparent 50%),
      radial-gradient(2px 2px at 70% 18%, rgba(255,255,255,0.85), transparent 50%),
      radial-gradient(2px 2px at 35% 60%, rgba(255,255,255,0.75), transparent 50%),
      radial-gradient(3px 3px at 88% 42%, rgba(255,255,255,0.9), transparent 50%),
      radial-gradient(1.5px 1.5px at 55% 84%, rgba(255,255,255,0.65), transparent 50%),
      radial-gradient(2px 2px at 8% 78%, rgba(255,255,255,0.85), transparent 50%),
      radial-gradient(1.5px 1.5px at 92% 22%, rgba(255,255,255,0.7), transparent 50%),
      radial-gradient(1.5px 1.5px at 25% 12%, rgba(255,255,255,0.75), transparent 50%),
      radial-gradient(2px 2px at 48% 48%, rgba(255,255,255,0.6), transparent 50%);
  }
  .frame {
    position: relative;
    width: 100%; height: 100%;
    padding: 50px 90px 38px;
    display: flex; flex-direction: column; justify-content: space-between;
    text-align: center;
  }
  .top { display: flex; flex-direction: column; align-items: center; }
  .kicker {
    font-family: var(--display);
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--pink);
    margin-bottom: 24px;
  }
  .kicker .star { color: var(--gold); margin: 0 10px; }
  h1 {
    font-family: var(--serif);
    font-size: 80px;
    line-height: 1.02;
    font-weight: 400;
    letter-spacing: -1.2px;
    color: var(--cream);
  }
  h1 .em {
    font-style: italic;
    color: var(--gold-bright);
    margin: 0 8px;
  }
  .sparkle {
    color: var(--gold);
    font-size: 56px;
    letter-spacing: 0.2em;
    margin: 10px 0 8px;
  }
  .subtitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: 26px;
    color: var(--muted);
    margin-top: 8px;
    max-width: 940px;
    align-self: center;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(212, 175, 55, 0.32);
    padding-top: 18px;
    text-align: left;
  }
  .brand {
    font-family: var(--display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream);
  }
  .brand .star { color: var(--gold); margin: 0 6px; }
  .meta {
    font-family: var(--display);
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold-bright);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="kicker"><span class="star">✦</span>Cosmic data<span class="star">✦</span></div>
      <h1>Your zodiac sign's <span class="em">best</span> scratcher strategy.</h1>
      <div class="sparkle">✦ ✦ ✦</div>
      <div class="subtitle">The stars cannot change your odds. But your personality absolutely picks the ticket.</div>
    </div>
    <div class="footer">
      <div class="brand">Smart<span class="star">✦</span>Scratcher</div>
      <div class="meta">— For entertainment only —</div>
    </div>
  </div>
</body>
</html>
