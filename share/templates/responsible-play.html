<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff9ef;
    --sage: #7d9775;
    --sage-light: #b8c9b1;
    --peach: #f7b27a;
    --terracotta: #c86d4c;
    --coffee: #4a3d2f;
    --ink: #1f1a14;
    --muted: #7a6d5c;
    --note: #fef3d8;
    --handwritten: 'Caveat', cursive;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    background-image:
      radial-gradient(ellipse at 10% 5%, rgba(247, 178, 122, 0.18), transparent 45%),
      radial-gradient(ellipse at 90% 90%, rgba(125, 151, 117, 0.15), transparent 50%);
  }
  .frame {
    position: relative;
    width: 1200px; height: 630px;
    padding: 38px 80px 32px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .kicker {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--handwritten);
    font-size: 30px;
    color: var(--sage);
    font-weight: 700;
  }
  .kicker .heart {
    font-family: var(--sans);
    font-size: 32px;
  }
  h1 {
    font-family: var(--serif);
    font-size: 64px;
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--coffee);
    margin-top: 6px;
  }
  h1 .em {
    font-style: italic;
    color: var(--terracotta);
    border-bottom: 4px solid var(--terracotta);
    padding-bottom: 4px;
  }
  .subtitle {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--muted);
    font-style: italic;
    margin-top: 14px;
    max-width: 900px;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px dashed var(--sage);
    padding-top: 14px;
  }
  .brand {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 24px;
    color: var(--coffee);
    letter-spacing: -0.3px;
  }
  .brand .dot { color: var(--terracotta); font-style: italic; }
  .tag {
    font-family: var(--handwritten);
    font-size: 30px;
    color: var(--terracotta);
    background: var(--note);
    padding: 4px 16px;
    transform: rotate(-1.5deg);
  }
</style>
</head>
<body>
  <div class="frame">
    <div>
      <div class="kicker"><span class="heart">💛</span><span>the real talk one</span></div>
      <h1>How to scratch for a year without <span class="em">ruining your life.</span></h1>
      <div class="subtitle">An honest, friendly guide to keeping scratch-offs in the fun column — budgeting, red flags, and resources.</div>
    </div>
    <div class="footer">
      <div class="brand">Smart<span class="dot">·</span>Scratcher</div>
      <div class="tag">— with care —</div>
    </div>
  </div>
</body>
</html>
